<rect x="40" y="1446" width="1750" height="110" rx="8" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
<text x="52" y="1470" font-size="12" fill="#333">65 komponen Tabel 2.1 = 15 Form + 13 Manager + 26 Entity + 9 DataBoundary + SATUSEHATGateway + BasisDataSEHATI.</text>
<text x="52" y="1490" font-size="12" fill="#333">Form hanya memanggil Manager; Manager yang mengolah Entity dan memanggil DataBoundary (Tabel 2.2). Semua Form memeriksa hak akses lewat AutentikasiManager.</text>
<text x="52" y="1510" font-size="12" fill="#333">Semua DataBoundary (kecuali SATUSEHATGateway) ke BasisDataSEHATI. SATUSEHAT hanya via SATUSEHATGateway.</text>
<text x="52" y="1534" font-size="11" fill="#666">Teknologi: JavaFX 21 (Presentation), Java 21 (Business + Data Access), JDBC → PostgreSQL 15 via LAN, pg_dump, REST API SATUSEHAT sandbox.</text>
</svg>