<text x="846.0" y="1315.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Melakukan pemeriksaan serta</text>
<text x="846.0" y="1330.5" text-anchor="middle" font-size="12.5" fill="#1f2933">mencatat diagnosis dan tindakan</text>
