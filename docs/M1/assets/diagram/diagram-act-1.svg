<text x="846.0" y="1223.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Membuka rekam medis, riwayat</text>
<text x="846.0" y="1238.5" text-anchor="middle" font-size="12.5" fill="#1f2933">kunjungan, dan penanda risiko</text>
