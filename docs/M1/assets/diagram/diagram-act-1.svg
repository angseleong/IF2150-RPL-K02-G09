<text x="138.0" y="232.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Menerima pasien dan meminta</text>
<text x="138.0" y="247.5" text-anchor="middle" font-size="12.5" fill="#1f2933">NIK atau kartu berobat</text>
<rect x="510.0" y="300" width="200" height="56" rx="10" ry="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="610.0" y="324.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Mencari data pasien pada</text>
<text x="610.0" y="339.5" text-anchor="middle" font-size="12.5" fill="#1f2933">basis data puskesmas</text>
<polygon points="610.0,392 712.0,434 610.0,476 508.0,434" fill="#fff6e0" stroke="#1f2933" stroke-width="1.6"/>
<text x="610.0" y="430.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Pasien sudah</text>
<text x="610.0" y="445.5" text-anchor="middle" font-size="12.5" fill="#1f2933">terdaftar?</text>
<rect x="38.0" y="512" width="200" height="56" rx="10" ry="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="138.0" y="536.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Mendaftarkan pasien baru dan</text>
<text x="138.0" y="551.5" text-anchor="middle" font-size="12.5" fill="#1f2933">membuat berkas rekam medis</text>
<rect x="38.0" y="604" width="200" height="56" rx="10" ry="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="138.0" y="628.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Membuat data kunjungan dan</text>
<text x="138.0" y="643.5" text-anchor="middle" font-size="12.5" fill="#1f2933">mencetak nomor antrean poli</text>
<rect x="510.0" y="696" width="200" height="56" rx="10" ry="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="610.0" y="720.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Menyimpan data kunjungan dan</text>
<text x="610.0" y="735.5" text-anchor="middle" font-size="12.5" fill="#1f2933">menampilkan daftar antrean poli</text>
