<text x="374.0" y="812.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Memanggil pasien serta mencatat</text>
<text x="374.0" y="827.5" text-anchor="middle" font-size="12.5" fill="#1f2933">keluhan awal dan tanda vital</text>
<text x="374.0" y="842.5" text-anchor="middle" font-size="12.5" fill="#1f2933">(tekanan darah, berat, suhu)</text>
<rect x="510.0" y="895" width="200" height="56" rx="10" ry="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="610.0" y="919.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Menyimpan tanda vital dan</text>
<text x="610.0" y="934.5" text-anchor="middle" font-size="12.5" fill="#1f2933">mengevaluasi ambang risiko</text>
<polygon points="610.0,987 712.0,1029 610.0,1071 508.0,1029" fill="#fff6e0" stroke="#1f2933" stroke-width="1.6"/>
<text x="610.0" y="1025.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Nilai di luar</text>
<text x="610.0" y="1040.5" text-anchor="middle" font-size="12.5" fill="#1f2933">ambang normal?</text>
