<text x="610.0" y="1131.5" text-anchor="middle" font-size="12.5" fill="#1f2933">Menandai kunjungan sebagai</text>
<text x="610.0" y="1146.5" text-anchor="middle" font-size="12.5" fill="#1f2933">berisiko penyakit tidak menular</text>
